name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: python -m pip install --upgrade pip ruff pytest "django>=4.2,<5" build
      - name: Lint (ruff)
        run: ruff check openedx_mcp tests
      - name: Unit tests (platform-free)
        run: python -m pytest -q
      - name: Byte-compile
        run: python -m compileall openedx_mcp
      - name: Build package (sdist + wheel)
        run: python -m build --outdir /tmp/dist .
