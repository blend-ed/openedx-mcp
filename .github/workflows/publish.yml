name: publish

# Publishes openedx-mcp to PyPI on a version tag, using PyPI Trusted Publishing
# (OIDC) — no API token stored in the repo.
#
# One-time PyPI setup: on pypi.org create the `openedx-mcp` project, then
# Settings → Publishing → add a GitHub trusted publisher with:
#   owner/repo   = <your org>/openedx-mcp
#   workflow     = publish.yml
#   environment  = pypi

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
      contents: read         # explicit permissions block replaces defaults; checkout needs this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
